name: Build and check learning pack
on:
  pull_request:
  push:
    branches: [codex/daily-learning-pack-scaffold]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:inquiry
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: daily-learning-pack-preview
          path: |
            dist/
            docs/stills/
